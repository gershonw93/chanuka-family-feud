<style>
/* Layout: a TV game-show stage (scores | board | scores) on night-blue; phones get one big centered card. */
:root {
  color-scheme: dark;
  --night: #071338;
  --navy: #0d2160;
  --blue: #1f4fd1;
  --sky: #7fb0ff;
  --gold: #f5c542;
  --gold-deep: #c98f12;
  --white: #ffffff;
  --ink: #0a1a4a;
  --red: #e5484d;
  --muted: #b7c6ee;
  --line: rgba(255, 255, 255, 0.14);
  --display: "Bagel Fat One", "Rubik", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--white);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
#root { min-height: 100%; }
.screen {
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(31, 79, 209, 0.55), transparent 70%),
    radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 14%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(2px 2px at 64% 72%, rgba(245,197,66,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 30% 82%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.5), transparent 60%),
    var(--night);
  overflow-x: hidden;
}
.screen.center { align-items: center; justify-content: center; text-align: center; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: 0.01em; line-height: 1.05; text-wrap: balance; }
.gold { color: var(--gold); }
.muted { color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; font-size: 0.85rem; color: var(--sky); }
.err { color: #ffb4b6; font-weight: 500; }
.panel {
  background: linear-gradient(180deg, rgba(31,79,209,.35), rgba(13,33,96,.75));
  border: 2px solid var(--line);
  border-radius: 22px;
  padding: 24px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* Buttons */
.btn {
  font-family: var(--body); font-weight: 800; font-size: 1.1rem;
  border-radius: 999px; padding: 0.8em 1.5em; border: 0; cursor: pointer;
  transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
  box-shadow: 0 5px 0 rgba(0,0,0,.35);
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-big { font-size: clamp(1.15rem, 1.6vw, 1.6rem); padding: .8em 1.6em; }
.btn-gold { background: linear-gradient(180deg, #ffe08a, var(--gold) 45%, var(--gold-deep)); color: var(--ink); }
.btn-blue { background: linear-gradient(180deg, #5b8cff, var(--blue)); color: var(--white); }
.btn-red { background: linear-gradient(180deg, #ff7a7e, var(--red)); color: var(--white); }
.btn-ghost { background: rgba(255,255,255,.08); color: var(--white); border: 2px solid var(--line); box-shadow: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.chip {
  background: rgba(255,255,255,.08); border: 1.5px solid var(--line); color: var(--white);
  border-radius: 999px; padding: .45em .95em; font-weight: 600; font-size: .95rem; cursor: pointer; white-space: nowrap;
}
.chip:disabled { opacity: .4; cursor: default; }
.chip-on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.chip-warn { background: var(--red); border-color: var(--red); }
.input {
  width: 100%; box-sizing: border-box; font: 500 1.2rem var(--body);
  padding: .75em .9em; border-radius: 14px; border: 2px solid var(--line);
  background: rgba(255,255,255,.95); color: var(--ink);
}
.input::placeholder { color: #7a86a8; }
.code-input { font-family: var(--display); font-size: 2rem; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.big-input { font-size: 1.5rem; text-align: center; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }

/* Menorah */
.menorah { display: inline-flex; flex-direction: column; align-items: center; }
.menorah .candles { display: flex; align-items: flex-end; gap: var(--gap, 6px); }
.menorah .candle { position: relative; width: var(--cw, 8px); height: var(--ch, 26px); border-radius: 2px; background: linear-gradient(180deg, #ffffff, #c9d8ff); }
.menorah .candle.shamash { height: calc(var(--ch, 26px) * 1.35); }
.menorah .flame { position: absolute; left: 50%; bottom: 100%; width: calc(var(--cw, 8px) * 1.1); height: calc(var(--cw, 8px) * 1.9); transform: translateX(-50%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff7c2, var(--gold) 45%, rgba(245,140,30,.0) 75%); opacity: 0; transition: opacity .4s; }
.menorah .candle.on .flame { opacity: 1; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
.menorah .candle:nth-child(odd).on .flame { animation-duration: 1.9s; }
@keyframes flicker { 0%,100% { transform: translateX(-50%) scale(1) rotate(-2deg); } 50% { transform: translateX(-50%) scale(.88, 1.08) rotate(3deg); } }
.menorah-base { width: 100%; height: var(--bh, 6px); margin-top: 3px; border-radius: 0 0 8px 8px; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
.menorah.sm { --cw: 6px; --ch: 18px; --gap: 5px; --bh: 4px; }
.menorah.lg { --cw: 14px; --ch: 46px; --gap: 12px; --bh: 9px; margin-bottom: 8px; }

/* Landing */
.landing { justify-content: center; }
.landing-inner { width: 100%; max-width: 980px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; align-items: start; }
.landing-inner > .text-center { grid-column: 1 / -1; }
.title { font-size: clamp(3.4rem, 9vw, 7rem); color: var(--gold); text-shadow: 0 6px 0 var(--gold-deep), 0 12px 30px rgba(0,0,0,.5); margin: 6px 0 4px; }
.tagline { font-size: clamp(1.05rem, 2vw, 1.4rem); color: var(--muted); }
@media (max-width: 720px) { .landing-inner { grid-template-columns: 1fr; } }

/* Host */
.host { height: 100dvh; min-height: 0; overflow: hidden; gap: 10px; }
.host-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: clamp(1.4rem, 2.2vw, 2.2rem); color: var(--gold); }
.round-pill, .code-pill { background: rgba(255,255,255,.1); border: 1.5px solid var(--line); border-radius: 999px; padding: .35em .9em; font-weight: 700; font-size: clamp(.95rem, 1.2vw, 1.25rem); white-space: nowrap; }
.code-pill b { font-family: var(--display); font-weight: 400; color: var(--gold); letter-spacing: .12em; margin-left: .3em; }
.sync-banner { background: var(--red); color: white; font-weight: 600; border-radius: 12px; padding: 10px 14px; }

.lobby { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; }
.lobby-code { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.big-code { display: flex; gap: clamp(8px, 1.2vw, 18px); margin: 12px 0; }
.big-code span { font-family: var(--display); font-size: clamp(4.5rem, 12vw, 11rem); line-height: 1; color: var(--ink); background: linear-gradient(180deg, #ffffff, #dbe6ff); border-radius: 22px; padding: .08em .22em .14em; box-shadow: 0 8px 0 var(--gold-deep), 0 0 0 4px var(--gold); animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
.lobby-steps { font-size: clamp(1.3rem, 2.4vw, 2.2rem); }
.lobby-side { background: rgba(13,33,96,.6); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; }
.settings { display: flex; flex-wrap: wrap; gap: 14px 22px; }
.setting { display: flex; flex-direction: column; gap: 6px; }
.setting-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--sky); font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.08); color: white; font-size: 1.5rem; cursor: pointer; }
.stepper b { font-family: var(--display); font-weight: 400; font-size: 2rem; min-width: 2ch; text-align: center; color: var(--gold); }
.seg { display: inline-flex; background: rgba(0,0,0,.25); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: .5em 1em; border-radius: 999px; cursor: pointer; font-size: 1rem; }
.seg button.on { background: var(--gold); color: var(--ink); }
.team-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.team-col { border-radius: 16px; padding: 12px; border: 2px solid var(--line); background: rgba(0,0,0,.18); min-width: 0; }
.team-col h3 { font-size: 1.4rem; margin-bottom: 8px; }
.team-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.team-name-input { flex: 1; min-width: 0; font-size: 1.4rem; color: var(--team, white); background: rgba(0,0,0,.25); border: 2px dashed rgba(255,255,255,.25); border-radius: 10px; padding: 4px 8px; }
.team-name-input:hover, .team-name-input:focus { border-color: var(--team, white); border-style: solid; }
.dice { background: rgba(255,255,255,.1); border: 1.5px solid var(--line); border-radius: 10px; font-size: 1.2rem; padding: 4px 8px; cursor: pointer; }
.team-col ul, .solo-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.team-a { --team: var(--sky); }
.team-b { --team: var(--gold); }
.team-col.team-a, .team-col.team-b { border-color: var(--team); }
.team-col.team-a h3, .team-col.team-b h3 { color: var(--team); }
.player-chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 600; animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.player-name { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 2px 0; }
.player-x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
.mini { border: 0; border-radius: 999px; padding: 3px 8px; font-weight: 700; font-size: .8rem; cursor: pointer; }
.mini.a { background: var(--sky); color: var(--ink); }
.mini.b { background: var(--gold); color: var(--ink); }

.game { flex: 1; min-height: 0; display: grid; gap: clamp(10px, 1.4vw, 22px); }
.game.teams { grid-template-columns: minmax(140px, 15vw) 1fr minmax(140px, 15vw); }
.game.solo { grid-template-columns: 1fr minmax(180px, 20vw); }
.stage { display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 16px); min-height: 0; min-width: 0; }
.question { font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 3.6vw, 4rem); line-height: 1.08; text-align: center; text-wrap: balance; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.board-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 1.4vh, 16px); }
.board { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(8px, 1vw, 14px); padding: clamp(10px, 1.2vw, 18px); border-radius: 26px; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); box-shadow: inset 0 0 0 4px rgba(255,255,255,.35), 0 16px 50px rgba(0,0,0,.45); }
.board.compact { grid-template-columns: 1fr; }
.card { perspective: 900px; border: 0; padding: 0; background: none; min-height: 0; cursor: default; font: inherit; color: inherit; }
.card.tappable { cursor: pointer; }
.card-inner { position: relative; display: block; width: 100%; height: 100%; height: clamp(54px, 10vh, 118px); transform-style: preserve-3d; transition: transform .6s cubic-bezier(.4,1.5,.5,1); }
.card.revealed .card-inner { transform: rotateX(180deg); }
.card-face { position: absolute; inset: 0; display: flex; align-items: center; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card-front { justify-content: center; background: linear-gradient(180deg, #2f63e8, var(--navy)); border: 3px solid rgba(255,255,255,.25); }
.card.tappable .card-front { border-color: rgba(255,255,255,.6); }
.card.tappable:hover .card-front { filter: brightness(1.15); }
.card-num { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 3.2rem); color: var(--ink); background: radial-gradient(circle at 40% 35%, #fff4c2, var(--gold) 60%, var(--gold-deep)); width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.card-peek { position: absolute; left: 12px; bottom: 6px; font-size: .8rem; color: rgba(255,255,255,.35); font-weight: 500; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-back { transform: rotateX(180deg); justify-content: space-between; gap: 10px; padding: 0 0 0 clamp(12px, 1.4vw, 24px); background: linear-gradient(180deg, #ffffff, #e2eaff); color: var(--ink); border: 3px solid #ffffff; overflow: hidden; }
.card.late .card-back { background: linear-gradient(180deg, #dfe6f7, #c3cfe9); color: #3a4a78; }
.card-text { font-weight: 800; font-size: clamp(1.1rem, 2.2vw, 2.4rem); text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; text-align: left; padding-block: 4px; }
.card-pts { font-family: var(--display); font-size: clamp(1.5rem, 2.8vw, 3rem); background: var(--blue); color: white; align-self: stretch; display: grid; place-items: center; padding: 0 .45em; min-width: 2.2em; }
.card.late .card-pts { background: #7d8db8; }
.bank { align-self: center; display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,.3); border: 2px solid var(--gold); border-radius: 999px; padding: .3em 1.2em; font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.4rem); text-transform: uppercase; letter-spacing: .1em; }
.bank b { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: clamp(1.8rem, 3vw, 3rem); letter-spacing: 0; }
.hidden-board { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; opacity: .35; }
.ghost-card { border: 3px dashed rgba(255,255,255,.35); border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-size: 2rem; }
.status { min-height: 0; }
.typed { align-self: center; text-align: center; font-size: clamp(1.1rem, 2vw, 1.9rem); font-weight: 600; padding: .3em 1em; border-radius: 14px; background: rgba(255,255,255,.08); animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.typed.hit b { color: #8ff0a4; } .typed.miss b, .typed.dup b { color: #ffb4b6; }
.typed.small { font-size: 1rem; animation: none; }
.typed.small.hit { color: #8ff0a4; } .typed.small.miss, .typed.small.dup { color: #ffb4b6; }
.typed .override { margin-left: .6em; vertical-align: middle; font-size: 1rem; background: var(--gold); color: var(--ink); border-color: var(--gold); }
.override-help { display: block; font-size: .8em; color: var(--muted); font-weight: 500; }
.typed.override b { color: var(--gold); }
.join-url { font-family: var(--display); font-size: clamp(2rem, 4.4vw, 4rem); color: var(--gold); margin: 4px 0 0; overflow-wrap: anywhere; }
.site-note { margin: 14px auto 0; max-width: 640px; background: var(--gold); color: var(--ink); border-radius: 14px; padding: 10px 16px; font-weight: 600; }
.prep { align-items: center; }
.prep-inner { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 16px; padding-block: 12px 32px; }
.prep-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prep-head h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); color: var(--gold); margin-right: auto; }
.prep-lead { font-size: 1.1rem; color: var(--muted); max-width: 65ch; }
.set-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.4rem; color: var(--gold); letter-spacing: .05em; user-select: all; overflow-wrap: anywhere; }
.prepared { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: rgba(245,197,66,.12); border: 1.5px solid var(--gold); border-radius: 14px; padding: 8px 12px; font-weight: 600; }
.prepared b { color: var(--gold); }
.remote-form { display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 12px; }
a.chip { text-decoration: none; display: inline-block; }
.remote-panel { grid-column: 1 / -1; border-color: var(--gold); }
.remote-in { width: 6.5em; flex: 0 0 auto; font-size: 1.1rem; text-align: center; letter-spacing: .15em; }
.pin { font-family: var(--display); font-size: 2.4rem; color: var(--gold); letter-spacing: .15em; }
.remote-sec { border: 2px solid var(--gold); border-radius: 14px; padding: 12px; background: rgba(245,197,66,.08); }
.remote-main { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.remote-q { font-family: var(--display); font-size: 1.5rem; text-align: center; text-wrap: balance; }
.remote-status { font-family: var(--display); font-size: 1.4rem; text-align: center; }
.remote-actions { display: flex; flex-direction: column; gap: 10px; }
.remote-actions > .btn { width: 100%; }
.remote-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer-key { display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,.2); border-radius: 16px; padding: 12px; }
.key-row { display: grid; grid-template-columns: 2em 1fr auto; gap: 10px; align-items: center; text-align: left; background: linear-gradient(180deg, #ffffff, #e2eaff); color: var(--ink); border: 0; border-radius: 12px; padding: 12px 14px; font: 700 1.05rem var(--body); cursor: pointer; }
.key-row:disabled { cursor: default; }
.key-row.done { background: rgba(255,255,255,.12); color: var(--muted); text-decoration: line-through; }
.key-n { font-family: var(--display); font-weight: 400; color: var(--blue); }
.key-row.done .key-n { color: var(--muted); }
.key-t { min-width: 0; overflow-wrap: anywhere; }
.key-row b { font-family: var(--display); font-weight: 400; color: var(--blue); }
.remote-scores { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; color: var(--muted); font-weight: 600; }
.remote-scores b { color: var(--gold); font-family: var(--display); font-weight: 400; }
.stakes { display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,.22); border-radius: 16px; padding: 14px; }
.phone-strikes { display: flex; justify-content: center; gap: 10px; }
.pstrike { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 16px; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.12); }
.pstrike .xmark { width: 54px; height: 54px; }
.pstrike.on { border-color: rgba(255,80,80,.6); box-shadow: 0 0 22px rgba(255,40,40,.45); }
.pstrike.on .xmark { animation: xslam .45s cubic-bezier(.2,1.6,.4,1) both; }
.stakes-line { font-weight: 700; font-size: 1.15rem; text-wrap: balance; }
.stakes-nums { display: flex; justify-content: center; gap: 18px; color: var(--muted); font-weight: 600; }
.stakes-nums b, .mini-scores b { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 1.4rem; margin-left: 4px; }
.mini-scores { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-weight: 600; color: var(--muted); }
.mini-scores .me { color: var(--white); }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.typed.pending b { color: var(--gold); }
.typed.small.pending { color: var(--gold); }
.pending-btns { display: inline-flex; gap: 6px; margin-left: .6em; vertical-align: middle; flex-wrap: wrap; }
.pending-btns .chip { font-size: 1rem; }
.review { display: flex; flex-direction: column; gap: 8px; text-align: center; background: rgba(245,197,66,.12); border: 2px solid var(--gold); border-radius: 18px; padding: 14px; animation: pop .35s cubic-bezier(.3,1.6,.5,1) both; }
.review-title { font-size: 1.1rem; }
.review-text { font-family: var(--display); font-size: 2rem; color: var(--gold); overflow-wrap: anywhere; }
.review .btn { width: 100%; }
